name: GavMonitor

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gavmonitor
  cancel-in-progress: false

jobs:
  monitor:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    env:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update local branch
        run: |
          git pull --rebase origin "${{ github.ref_name }}" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Ensure project directories exist
        run: |
          mkdir -p data
          mkdir -p logs

          if [ ! -f data/alerted_incidents.json ]; then
            echo "[]" > data/alerted_incidents.json
          fi

      - name: Run GavMonitor
        run: |
          python src/monitor.py

      - name: Commit updated incident state
        run: |
          git add data/alerted_incidents.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update incident alert state"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gavmonitor-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
