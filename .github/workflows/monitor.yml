name: Nashville Fire Department Unit Monitor

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfd-unit-monitor
  cancel-in-progress: false

jobs:
  monitor:

    runs-on: ubuntu-latest

    env:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore incident state
        run: |
          git pull origin "${{ github.ref_name }}" || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure directories exist
        run: |
          mkdir -p data
          mkdir -p logs

      - name: Run monitor
        run: |
          python src/monitor.py

      - name: Commit updated incident state
        run: |
          if [ -f data/alerted_incidents.json ]; then

            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            git add data/alerted_incidents.json

            if git diff --cached --quiet; then
              echo "No state changes."
            else
              git commit -m "Update monitored incident state"
              git push
            fi

          fi

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-logs
          path: logs/
          retention-days: 14
